[workspace]
resolver = "3"
members = ["crates/piv-core", "crates/piv-io", "crates/piv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
piv-core = { path = "crates/piv-core" }
piv-io = { path = "crates/piv-io", default-features = false }
anyhow = "1"
ndarray = { version = "0.17", features = ["rayon"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
